<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b16">
<title>ANIME WORLD</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090b16;color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#111629;padding:18px 5%;
 display:flex;justify-content:space-between;
 align-items:center;border-bottom:1px solid #292d48;
 position:sticky;top:0;z-index:10;
}
.logo{font-size:24px;font-weight:900;color:#a78bfa}
.logo span{color:#22d3ee}
header a{color:white;text-decoration:none}
.hero{
 padding:55px 5%;background:
 radial-gradient(circle at 80% 20%,#54269b,#090b16 65%);
}
.hero h1{font-size:48px;margin:10px 0}
.hero p{color:#c0c5d8;line-height:1.6}
.search{
 width:100%;max-width:600px;padding:16px;
 border-radius:12px;border:1px solid #444;
 background:#171e34;color:white;font-size:16px;
 outline:none;
}
main{padding:25px 5%}
.heading{display:flex;justify-content:space-between;align-items:center}
.heading h2{font-size:26px}
#count{color:#aaa}
.filters{
 display:flex;gap:10px;overflow-x:auto;
 padding:10px 0 20px;
}
.filter{
 background:#171e34;color:white;border:1px solid #343b58;
 padding:10px 16px;border-radius:25px;
 white-space:nowrap;cursor:pointer;
}
.filter.active{background:#7c3aed;border-color:#7c3aed}
.grid{
 display:grid;
 grid-template-columns:repeat(5,minmax(0,1fr));
 gap:18px;
}
.card{
 background:#151b2d;border-radius:14px;
 overflow:hidden;border:1px solid #ffffff15;
 cursor:pointer;transition:.25s;
}
.card:hover{transform:translateY(-6px);border-color:#8b5cf6}
.poster{width:100%;aspect-ratio:2/2.85;background:#252b45}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:12px}
.name{font-size:14px;font-weight:bold;line-height:1.4;min-height:38px}
.tag{
 display:inline-block;margin-top:8px;
 background:#39246a;color:#d7c5ff;
 padding:5px 9px;border-radius:20px;font-size:11px;
}
.empty{display:none;text-align:center;color:#aaa;padding:40px}
footer{text-align:center;padding:25px;color:#999;border-top:1px solid #252b45}
.modal{
 display:none;position:fixed;inset:0;background:#000d;
 z-index:30;align-items:center;justify-content:center;padding:15px;
}
.modal.show{display:flex}
.modalbox{
 position:relative;background:#171e34;border-radius:18px;
 width:100%;max-width:650px;display:grid;
 grid-template-columns:200px 1fr;overflow:hidden;
}
.modalbox img{width:100%;height:100%;object-fit:cover;min-height:260px}
.modaltext{padding:25px}
.modaltext p{color:#b5bdd2;line-height:1.6}
.modaltext a{
 display:inline-block;background:#7c3aed;color:white;
 padding:12px 15px;border-radius:10px;text-decoration:none;
 margin-top:10px;font-weight:bold
}
.close{
 position:absolute;right:10px;top:10px;
 border:0;border-radius:50%;width:32px;height:32px;
 background:#333;color:white;font-size:20px;
}
@media(max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:600px){
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .hero h1{font-size:38px}
 .hero{padding:40px 5%}
 .modalbox{grid-template-columns:115px 1fr}
 .modaltext{padding:18px 12px}
}
</style>
</head>

<body>

<header>
 <div class="logo">ANIME<span>WORLD</span></div>
 <a href="#anime">EXPLORE ↓</a>
</header>

<section class="hero">
 <h1>ENTER THE<br>ANIME WORLD</h1>
 <p>Discover your favourite anime. Explore action, fantasy, adventure and more!</p>
 <input class="search" id="search" type="search" placeholder="🔍 Search your anime...">
</section>

<main id="anime">
 <div class="heading">
  <h2>🔥 Explore Anime</h2>
  <span id="count">20 Anime</span>
 </div>

 <div class="filters" id="filters"></div>
 <div class="grid" id="grid"></div>
 <div class="empty" id="empty">No anime found!</div>
</main>

<footer>
 ANIME WORLD © 2026
</footer>

<div class="modal" id="modal">
 <div class="modalbox">
  <button class="close" id="close">×</button>
  <img id="modalImg" src="" alt="">
  <div class="modaltext">
   <h2 id="modalTitle"></h2>
   <span class="tag" id="modalTag"></span>
   <p>Explore this anime and find official streaming availability.</p>
   <a id="watchLink" target="_blank" rel="noopener">Find Watch Options ↗</a>
  </div>
 </div>
</div>

<script>
const anime = [
{name:"Naruto",poster:"posters/naruto.jpg",category:"Action"},
{name:"Naruto Shippuden",poster:"posters/naruto-shippuden.jpg",category:"Action"},
{name:"Solo Leveling",poster:"posters/solo-leveling.jpg",category:"Fantasy"},
{name:"Demon Slayer",poster:"posters/demon-slayer.jpg",category:"Action"},
{name:"Black Clover",poster:"posters/black-clover.jpg",category:"Fantasy"},
{name:"One Piece",poster:"posters/one-piece.jpg",category:"Adventure"},
{name:"Jujutsu Kaisen",poster:"posters/jujutsu-kaisen.jpg",category:"Action"},
{name:"Attack on Titan",poster:"posters/attack-on-titan.jpg",category:"Action"},
{name:"Spy x Family",poster:"posters/spy-x-family.jpg",category:"Comedy"},
{name:"Chainsaw Man",poster:"posters/chainsaw-man.jpg",category:"Action"},
{name:"Blue Lock",poster:"posters/blue-lock.jpg",category:"Sports"},
{name:"My Hero Academia",poster:"posters/my-hero-academia.jpg",category:"Action"},
{name:"Tokyo Revengers",poster:"posters/tokyo-revengers.jpg",category:"Action"},
{name:"Haikyuu!!",poster:"posters/haikyuu.jpg",category:"Sports"},
{name:"Death Note",poster:"posters/death-note.jpg",category:"Thriller"},
{name:"Dragon Ball Z",poster:"posters/dragon-ball-z.jpg",category:"Action"},
{name:"The Daily Life of the Immortal King",poster:"posters/daily-life-of-the-immortal-king.jpg",category:"Fantasy"},
{name:"Classroom of the Elite",poster:"posters/classroom-of-the-elite.jpg",category:"Drama"},
{name:"Fullmetal Alchemist: Brotherhood",poster:"posters/fullmetal-alchemist-brotherhood.jpg",category:"Adventure"},
{name:"Steins;Gate",poster:"posters/steins-gate.jpg",category:"Sci-Fi"}
];

const grid=document.getElementById("grid");
const search=document.getElementById("search");
const filters=document.getElementById("filters");
let active="All";

const categories=["All",...new Set(anime.map(a=>a.category))];

categories.forEach(c=>{
 const b=document.createElement("button");
 b.className="filter"+(c==="All"?" active":"");
 b.textContent=c;
 b.onclick=()=>{
  active=c;
  document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));
  render();
 };
 filters.appendChild(b);
});

function render(){
 const q=search.value.toLowerCase().trim();
 const shown=anime.filter(a=>
  (active==="All"||a.category===active)&&
  a.name.toLowerCase().includes(q)
 );

 grid.innerHTML="";

 shown.forEach(a=>{
  const card=document.createElement("div");
  card.className="card";

  const poster=document.createElement("div");
  poster.className="poster";

  const img=document.createElement("img");
  img.src=a.poster;
  img.alt=a.name+" poster";
  img.loading="lazy";
  img.onerror=()=>{
   img.style.display="none";
   poster.style.background="linear-gradient(135deg,#312e81,#0e7490)";
  };

  poster.appendChild(img);

  const info=document.createElement("div");
  info.className="info";

  const name=document.createElement("div");
  name.className="name";
  name.textContent=a.name;

  const tag=document.createElement("span");
  tag.className="tag";
  tag.textContent=a.category;

  info.append(name,tag);
  card.append(poster,info);
  card.onclick=()=>openModal(a);
  grid.appendChild(card);
 });

 document.getElementById("count").textContent=shown.length+" Anime";
 document.getElementById("empty").style.display=shown.length?"none":"block";
}

function openModal(a){
 document.getElementById("modalImg").src=a.poster;
 document.getElementById("modalTitle").textContent=a.name;
 document.getElementById("modalTag").textContent=a.category;
 document.getElementById("watchLink").href=
 "https://www.justwatch.com/in/search?q="+encodeURIComponent(a.name);
 document.getElementById("modal").classList.add("show");
}

function closeModal(){
 document.getElementById("modal").classList.remove("show");
}

search.addEventListener("input",render);
document.getElementById("close").onclick=closeModal;
document.getElementById("modal").onclick=e=>{
 if(e.target.id==="modal")closeModal();
};
document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeModal();
});

render();
</script>

</body>
</html>
